<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Meta Pixel -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1339532338381439');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1339532338381439&ev=PageView&noscript=1"/></noscript>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      background: #ffffff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
    }
    main {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .heart {
      width: 168px;
      height: auto;
      margin: 0 auto 36px;
      display: block;
    }
    h1 {
      font-size: clamp(1.7rem, 4vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    p {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.55;
      color: #3f8f45;
    }
    @media (max-width: 520px) {
      .heart { width: 132px; margin-bottom: 28px; }
      p { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <main>
    <img class="heart" src="assets/heart.png" alt="">
    <h1>Te estamos profundamente agradecidos.</h1>
    <p>¡Tu participación ha sido confirmada!</p>
  </main>
  <script>
  (function () {
    var ALLOWED = { "30": 1, "49": 1, "100": 1, "150": 1, "300": 1 };
    var params;
    try {
      params = new URLSearchParams(window.location.search);
    } catch (_) {
      return;
    }
    var amountKey = String(params.get("amount") || "").trim();
    if (!ALLOWED[amountKey]) return;
    var value = Number(amountKey);
    var currency = String(params.get("currency") || "USD").trim().toUpperCase() || "USD";

    var storageKey = "meta_purchase_" + amountKey;
    try {
      if (sessionStorage.getItem(storageKey) === "1") return;
      sessionStorage.setItem(storageKey, "1");
    } catch (_) {}

    function firePurchase() {
      if (!window.fbq) return;
      try {
        fbq("track", "Purchase", {
          value: value,
          currency: currency,
          content_ids: [amountKey],
          content_type: "product",
          content_name: "Option $" + amountKey,
          num_items: 1
        });
      } catch (_) {}
    }

    if (window.fbq) {
      firePurchase();
    } else {
      var tries = 0;
      var t = setInterval(function () {
        tries += 1;
        if (window.fbq || tries > 40) {
          clearInterval(t);
          firePurchase();
        }
      }, 100);
    }
  })();
  </script>
</body>
</html>
